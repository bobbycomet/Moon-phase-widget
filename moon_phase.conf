-- =====================================================================
--  moon_phase.conf  —  standalone conky config for the moon phase widget
--  ---------------------------------------------------------------
--  Launch with:
--      conky -c ~/.config/conky/moon_phase.conf
--
--  Files expected next to this one (same folder):
--      moon_phase.lua
--
--  Window settings below are copied from the working ArkhamOS HUD's
--  conky.conf (own_window_type='normal' + 'below' hint + background=
--  false, no own_window_colour) rather than guessed independently —
--  that combination is confirmed working with this compositor/WM.
--  Requires a compositor (picom / your DE's built-in one) to be
--  running for the ARGB transparency to render see-through instead
--  of black.
-- =====================================================================

conky.config = {
    -- ---- Lua hook wiring ----
    lua_load = os.getenv('HOME') .. '/.config/conky/moon_phase.lua',
    lua_draw_hook_post = 'conky_moon_post',

    -- ---- Update rate ----
    -- The moon phase changes over hours, not seconds — no need to
    -- redraw every second. 60s keeps CPU usage effectively at zero.
    update_interval = 60,
    total_run_times = 0,

    -- ---- Window ----
    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'conky-moon',
    own_window_title = 'conky-moon-phase',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,          -- fully transparent background
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    background = false,

    minimum_width = 220,
    minimum_height = 90,
    maximum_width = 220,

    alignment = 'top_left',
    gap_x = 40,
    gap_y = 40,

    border_inner_margin = 0,
    border_outer_margin = 0,

    -- ---- Rendering ----
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- ---- Fonts ----
    -- moon_phase.lua uses 'Share Tech Mono' by default (CFG.FONT_MAIN).
    -- If you don't have it installed, either:
    --   sudo apt install fonts-share-tech-mono     (Debian/Ubuntu, if packaged)
    -- or grab it from Google Fonts and drop it in ~/.local/share/fonts,
    -- then run `fc-cache -f`.
    -- Otherwise just change CFG.FONT_MAIN in moon_phase.lua to any
    -- font you already have (e.g. 'DejaVu Sans Mono').
    use_xft = true,
    font = 'Share Tech Mono:size=10',

    -- NOTE: own_window_colour intentionally omitted — setting it (even
    -- to black) paints a solid background behind the ARGB window on
    -- many WMs, which is what caused the black box originally.
    default_color = 'FFFFFF',
}

-- The Lua script does all the drawing via Cairo in conky_moon_post,
-- so conky.text can stay empty — it only needs to exist so conky has
-- a window to draw into.
conky.text = [[
]]
